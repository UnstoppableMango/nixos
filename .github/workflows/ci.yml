name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: thecluster
    env:
      # Boehm GC, which nix's evaluator allocates through, warns on every
      # repeated allocation larger than its 256 KiB block size. Large attrsets
      # make that constant and harmless noise. Raise the interval past anything
      # an evaluation will hit.
      GC_LARGE_ALLOC_WARN_INTERVAL: 100000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # The runner pod is capped at 8 CPU / 8Gi (the-cluster's
          # apps/arc-runners/helm-release.yml defaults). Nix sizes `max-jobs =
          # auto` off the node's CPU count rather than the cgroup limit, so it
          # has to be set explicitly or a big node spawns enough parallel builds
          # to OOM the pod. 2 x 4 fills the CPU limit at ~4Gi per build.
          extra_nix_config: |
            max-jobs = 2
            cores = 4
            # install-nix-action drops its own `experimental-features =
            # nix-command flakes` line as soon as extra_nix_config mentions
            # `experimental-features` at all, which `extra-` matches. Spell the
            # whole set out so nix-command survives.
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # The runner image's nix is a static musl build, and musl's execvp
          # does not fall back to /bin/sh for a script without a shebang. The
          # post-build hook cachix-action writes for daemon mode starts with a
          # blank line, so nix cannot exec it and fails the first local build.
          # Store-scan mode pushes the store diff after the job instead.
          useDaemon: false

      - run: nix flake check
      - run: nix build .#nixosConfigurations.hades.config.system.build.toplevel

  rpi-kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - run: nix build .#rpi-kernel
